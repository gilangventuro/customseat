<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilih Model Kursi | Alldila Seats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f2; --line:#e6e6e8;
    --text:#14161a; --muted:#8a8d93; --brand:#2c9d36; --brand-2:#237a2b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(180deg,#e9ebee 0%,#eef0f2 45%,#f8f9fa 100%);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
  button{font:inherit;color:inherit}
  .notice{background:#fbf3d9;border-bottom:1px solid #ecd98a;color:#7a5f06;font-size:12.5px;padding:8px 20px;text-align:center}
  .notice a{color:#7a5f06}
  .wrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .topbar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 24px 4px;text-align:center}
  .topbar img{height:36px;width:auto}
  .topbar span{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

  .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;cursor:grab}
  .stage.dragging{cursor:grabbing}
  .track{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .card{position:absolute;width:588px;max-width:92vw;height:min(88%,560px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:transform .45s cubic-bezier(.22,.8,.3,1),opacity .45s,filter .45s;user-select:none;cursor:pointer}
  .stage.orbiting .card{transition:none}
  .card.center{cursor:grab}
  .card canvas{width:100%;flex:1;display:block;pointer-events:none}
  .card.center canvas{pointer-events:auto;cursor:grab;touch-action:none}
  .card.center canvas:active{cursor:grabbing}
  .card .name{display:none;text-align:center;font-size:14px;font-weight:700;margin-top:6px}
  .card .name small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}

  .stage{padding-bottom:12px}
  .btn-pick{margin-top:4px;background:var(--brand);border:1px solid var(--brand);color:#fff;border-radius:12px;padding:13px 32px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s}
  .btn-pick:hover{background:var(--brand-2)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:10px}


  /* ---------- panel spesifikasi: muncul dari belakang kursi (gepeng -> mekar) ---------- */
  .side{position:absolute;top:50%;left:calc(50% + 285px);width:min(340px,calc(50vw - 300px));transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:stretch;gap:18px}
  .specs{pointer-events:none;
    transform-origin:0 50%;transform:translateX(-190px) scale(.03,.42);opacity:0;
    transition:transform .1s ease-in,opacity .1s ease-in;
    background:radial-gradient(120% 70% at 0% 0%,rgba(46,160,67,.30),rgba(46,160,67,0) 60%),linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid rgba(255,255,255,.75);border-radius:26px;
    box-shadow:0 24px 50px -22px rgba(30,50,80,.38),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.35);overflow:hidden}
  .specs.show{transform:none;opacity:1;transition:transform .75s cubic-bezier(.2,1.25,.35,1),opacity .3s ease}
  .cta{transform-origin:0 50%;transform:translateX(-190px) scale(.03,.42);opacity:0;pointer-events:none;transition:transform .1s ease-in,opacity .1s ease-in;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .cta.show{transform:none;opacity:1;pointer-events:auto;transition:transform .6s cubic-bezier(.2,1.25,.35,1) .3s,opacity .3s ease .3s}
  .cta .btn-pick{margin-top:0;width:100%}
  .cta .hint{margin-top:6px}
  .specs h3{margin:0;padding:22px 24px 6px;font-size:21px;font-weight:700;letter-spacing:-.2px}
  .specs ul{list-style:none;margin:0;padding:6px 24px 14px}
  .specs li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(60,70,90,.09);font-size:13px;
    opacity:0;transform:translateX(-10px);transition:opacity .1s ease,transform .1s ease}
  .specs li:last-child{border-bottom:0}
  .specs.show li{opacity:1;transform:none;transition:opacity .4s ease var(--d),transform .4s ease var(--d)}
  .specs li svg{width:18px;height:18px;flex:0 0 auto;stroke:#4a4e55;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .specs li .k{color:#3a3d43;flex:1}
  .specs li .v{font-weight:600;text-align:right;color:var(--text)}
  /* mobile / layar sempit: kartu di bawah model, animasi tumbuh dari atas ke bawah */
  @media (max-width:1000px){
    .stage{flex:none;display:block;overflow:hidden;padding-bottom:24px}
    .track{height:340px}
    .card{height:100%}
    .side{position:relative;left:auto;top:auto;transform:none;width:min(360px,90vw);margin:6px auto 0}
    .specs,.cta{transform-origin:50% 0;transform:translateY(-30px) scale(.9,.03)}
    .specs li{padding:10px 0}
  }

  @media (max-width:640px){
    .card{width:320px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><img src="assets/logo-alldila-seats.png" alt="Alldila Seats"><span>Pilih Model Kursi</span></div>

  <div class="stage" id="stage">
    <div class="track" id="track"></div>
    <div class="side">
      <aside class="specs" id="specs" aria-label="Spesifikasi"></aside>
      <div class="cta">
        <button class="btn-pick" id="btnPick">Pilih model ini</button>
        <div class="hint">Model akan dibuka di halaman edit warna &amp; material.</div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* ---------- daftar model (ganti "file" per model saat aset asli sudah ada) ---------- */
const MODELS = [
  {
    id: "kursi-gaming-pro",
    name: "VIP Seat",
    desc: "Model 3D asli yang dipakai untuk menguji simulator (putar, zoom & ganti warna).",
    file: "assets/kursipijat.fbx",
    dummy: false,
    target: "dummy-kursi-gaming.html",
  },
  {
    id: "kursi-twinseat",
    name: "Twin Captain Seat",
    desc: "Dari hasil scan 3D — detail jahitan & list asli, warna kulit bisa diganti.",
    file: "assets/twin-seat-meshy.glb",
    dummy: false,
    target: "dummy-kursi-twinseat.html",
  },
];

const track = document.getElementById('track');
const btnPick = document.getElementById('btnPick');
const stage = document.getElementById('stage');

let centerIndex = MODELS.findIndex(m => m.id === 'kursi-twinseat');
if (centerIndex < 0) centerIndex = 0;
const cards = [];
const sharedModels = {}; // file -> loaded THREE.Object3D (base, for cloning)
const fbxLoader = new FBXLoader();
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
gltfLoader.setDRACOLoader(dracoLoader);

function getBaseModel(file, stripMaterials){
  if (sharedModels[file]) return sharedModels[file].promise;
  const isGltf = /\.(glb|gltf)$/i.test(file);
  const p = new Promise((resolve, reject) => {
    const onLoad = raw => {
      const obj = isGltf ? raw.scene : raw;
      if (stripMaterials && stripMaterials.length) {
        const toStrip = [];
        obj.traverse(n => {
          if (!n.isMesh) return;
          const mats = Array.isArray(n.material) ? n.material : [n.material];
          if (mats.some(m => stripMaterials.includes(m.name))) toStrip.push(n);
        });
        toStrip.forEach(n => n.parent && n.parent.remove(n));
      }
      obj.traverse(n => {
        if (!n.isMesh) return;
        const mats = Array.isArray(n.material) ? n.material : [n.material];
        mats.forEach(m => { m.side = THREE.DoubleSide; });
      });
      resolve(obj);
    };
    (isGltf ? gltfLoader : fbxLoader).load(file, onLoad, undefined, reject);
  });
  sharedModels[file] = { promise: p };
  return p;
}

MODELS.forEach((m) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <canvas></canvas>
    <div class="name">${m.name}${m.dummy ? '<small>Placeholder model</small>' : ''}</div>
  `;
  track.appendChild(card);

  const entry = { el: card, model: m, renderer: null, scene: null, camera: null, group: null, ready: false, rotY: 0 };
  card.addEventListener('click', () => { if (!justDragged) setCenter(cards.indexOf(entry)); });
  cards.push(entry);

  /* ---------- putar manual kursi yang di tengah: hanya depan - kiri - kanan, tidak sampai belakang ---------- */
  const ROT_LIMIT = Math.PI * 0.4; // ~72 derajat dari depan ke tiap sisi
  const canvasEl = card.querySelector('canvas');
  let rotating = false, rotStartX = 0, rotStartY = 0;
  canvasEl.addEventListener('pointerdown', e => {
    if (!card.classList.contains('center') || !entry.group) return;
    rotating = true; rotStartX = e.clientX; rotStartY = entry.rotY;
    canvasEl.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  canvasEl.addEventListener('pointermove', e => {
    if (!rotating) return;
    e.stopPropagation();
    const dx = e.clientX - rotStartX;
    entry.rotY = Math.max(-ROT_LIMIT, Math.min(ROT_LIMIT, rotStartY + dx * 0.008));
    entry.group.rotation.y = entry.rotY;
    entry.renderer.render(entry.scene, entry.camera);
  });
  canvasEl.addEventListener('pointerup', e => {
    if (!rotating) return;
    rotating = false;
    e.stopPropagation();
  });
});

function setupMiniViewer(entry){
  const canvas = entry.el.querySelector('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x9098a2, 1.6);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 2.1);
  key.position.set(200, 300, 150);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.0);
  fill.position.set(-180, 120, -120);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.8);
  rim.position.set(0, 150, -250);
  scene.add(rim);

  entry.renderer = renderer;
  entry.scene = scene;
  entry.camera = camera;

  getBaseModel(entry.model.file, entry.model.stripMaterials).then(base => {
    const clone = base.clone(true);
    clone.traverse(n => { if (n.isMesh) { n.castShadow = false; n.receiveShadow = false; } });
    if (entry.model.preRotateX) clone.rotation.x = entry.model.preRotateX;

    const box = new THREE.Box3().setFromObject(clone);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    /* clone bisa punya offset koordinat lokal yang jauh dari origin (mis. aset FBX
       yang awalnya bagian dari scene besar). Taruh clone di dalam pivot kosong di
       origin supaya memutar pivot (bukan clone langsung) berputar di tempat, tidak
       "terbang" mengorbit titik offset tsb. */
    const pivot = new THREE.Group();
    clone.position.sub(center);
    pivot.add(clone);
    scene.add(pivot);

    const radius = Math.max(size.x, size.y, size.z) * 0.5 || 100;
    const dist = radius / Math.sin((camera.fov * Math.PI / 180) / 2) * 1.2;
    camera.position.set(dist * 0.12, dist * 0.1, dist * 1.0);
    camera.near = radius / 100; camera.far = radius * 50;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    entry.group = pivot;
    entry.ready = true;
    resizeViewer(entry);
  }).catch(err => console.error('Gagal memuat model preview', err));
}

function resizeViewer(entry){
  if (!entry.renderer) return;
  const w = entry.el.clientWidth, h = entry.el.clientHeight;
  if (!w || !h) return;
  entry.renderer.setSize(w, h, false);
  entry.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  if (entry.camera) { entry.camera.aspect = w / h; entry.camera.updateProjectionMatrix(); }
}

cards.forEach(setupMiniViewer);
window.addEventListener('resize', () => cards.forEach(resizeViewer));

/* ---------- carousel orbit: kursi lama berputar ke belakang lalu berhenti di sisi kiri (blur) ---------- */
const PHI_FRONT = 0, PHI_LEFT = 270;
function poseCard(entry){
  const gap = Math.min(stage.clientWidth * 0.36, 400);
  const r = entry.phi * Math.PI / 180;
  const d = Math.cos(r), x = Math.sin(r) * gap;
  const scale = d >= 0 ? 0.68 + 0.32 * d : 0.68 + 0.14 * d;
  const y = d < 0 ? d * 18 : 0;
  const blur = d >= 0 ? 2.5 * (1 - d) : 2.5 + 2.5 * -d;
  const op = d >= 0 ? 0.55 + 0.45 * d : 0.55 + 0.15 * d;
  const el = entry.el;
  el.style.transform = `translate(${x}px,${y}px) scale(${scale})`;
  el.style.zIndex = Math.round(10 + d * 6);
  el.style.opacity = op;
  el.style.filter = blur < 0.05 ? 'none' : `blur(${blur}px)`;
}
function layout(){
  cards.forEach((entry, i) => {
    entry.phi = i === centerIndex ? PHI_FRONT : PHI_LEFT;
    entry.el.classList.toggle('center', i === centerIndex);
    poseCard(entry);
  });
  requestAnimationFrame(() => cards.forEach(resizeViewer));
}
let orbitRaf = null;
function orbitTo(){
  const from = cards.map(e => e.phi), delta = cards.map((e, i) => {
    const goal = i === centerIndex ? PHI_FRONT : PHI_LEFT;
    return (((goal - e.phi) % 360) + 360) % 360;
  });
  cards.forEach((e, i) => e.el.classList.toggle('center', i === centerIndex));
  cancelAnimationFrame(orbitRaf);
  stage.classList.add('orbiting');
  const t0 = performance.now(), DUR = 950;
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  (function frame(now){
    const t = Math.min(1, (now - t0) / DUR), k = ease(t);
    cards.forEach((e, i) => { e.phi = from[i] + delta[i] * k; poseCard(e); if (e.ready && e.group) e.renderer.render(e.scene, e.camera); });
    if (t < 1) orbitRaf = requestAnimationFrame(frame);
    else { cards.forEach(e => { e.phi %= 360; poseCard(e); }); stage.classList.remove('orbiting'); }
  })(t0);
}


/* ---------- spesifikasi model (muncul dari belakang kursi saat model dipilih) ---------- */
const ICONS = {
  seat:'<svg viewBox="0 0 24 24"><path d="M6 11V7a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4"/><path d="M4 12a2 2 0 0 1 2 2v2h12v-2a2 2 0 1 1 4 0v4H2v-4a2 2 0 0 1 2-2z"/><path d="M5 20v1.5M19 20v1.5"/></svg>',
  leather:'<svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>',
  frame:'<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  stitch:'<svg viewBox="0 0 24 24"><path d="M4 8h3M10 8h4M17 8h3M4 16h3M10 16h4M17 16h3"/><path d="M8.5 4v8M15.5 12v8"/></svg>',
  finish:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z"/><path d="M19 16v4M17 18h4"/></svg>',
  size:'<svg viewBox="0 0 24 24"><path d="m14 4 6 6L10 20l-6-6z"/><path d="m8 10 2 2M11 7l2 2M5 13l2 2"/></svg>'
};
MODELS.find(m => m.id === 'kursi-gaming-pro').specs = [
  { icon:'seat',    k:'Konfigurasi',   v:'1 Seat' },
  { icon:'leather', k:'Material Cover', v:'Synthetic Leather' },
  { icon:'frame',   k:'Rangka',        v:'Metal Frame' },
  { icon:'stitch',  k:'Jahitan',       v:'Premium Stitching' },
  { icon:'finish',  k:'Finishing',     v:'Emboss / Quilted' },
  { icon:'size',    k:'Dimensi',       v:'60 × 85 cm' }
];
MODELS.find(m => m.id === 'kursi-twinseat').specs = [
  { icon:'seat',    k:'Konfigurasi',   v:'2 Seat' },
  { icon:'leather', k:'Material Cover', v:'Synthetic Leather' },
  { icon:'frame',   k:'Rangka',        v:'Metal Frame' },
  { icon:'stitch',  k:'Jahitan',       v:'Premium Stitching' },
  { icon:'finish',  k:'Finishing',     v:'Emboss / Quilted' },
  { icon:'size',    k:'Dimensi',       v:'120 × 85 cm' }
];
const specsEl = document.getElementById('specs'), ctaEl = document.querySelector('.cta');
let specsTimer = null, specsFor = null;
function updateSpecs(delay){
  const m = cards[centerIndex].model;
  clearTimeout(specsTimer);
  if (!m.specs) { specsEl.classList.remove('show'); specsFor = null; specsTimer = setTimeout(() => ctaEl.classList.add('show'), delay); return; }
  if (specsFor === m.id && specsEl.classList.contains('show')) return;
  specsEl.classList.remove('show'); ctaEl.classList.remove('show');
  specsTimer = setTimeout(() => {
    specsEl.innerHTML = `<h3>${m.name}</h3><ul>` + m.specs.map((r, i) =>
      `<li style="--d:${0.35 + i * 0.07}s">${ICONS[r.icon]}<span class="k">${r.k}</span><span class="v">${r.v}</span></li>`).join('') + '</ul>';
    specsFor = m.id;
    void specsEl.offsetWidth;            /* paksa reflow supaya animasi mulai dari kondisi gepeng */
    specsEl.classList.add('show'); ctaEl.classList.add('show');
  }, delay);
}

function setCenter(i){
  centerIndex = ((i % cards.length) + cards.length) % cards.length;
  orbitTo();
  updateSpecs(1000);
}

/* ---------- pilih model: klik kartu di samping, atau geser (drag) dengan kursor ---------- */
let dragStartX = null, justDragged = false;
stage.addEventListener('pointerdown', e => { dragStartX = e.clientX; stage.classList.add('dragging'); });
stage.addEventListener('pointermove', e => {
  if (dragStartX === null) return;
  if (Math.abs(e.clientX - dragStartX) > 8) justDragged = true;
});
stage.addEventListener('pointerup', e => {
  if (dragStartX === null) return;
  const dx = e.clientX - dragStartX;
  dragStartX = null;
  stage.classList.remove('dragging');
  if (Math.abs(dx) > 40) {
    setCenter(centerIndex + (dx < 0 ? 1 : -1));
  }
  setTimeout(() => { justDragged = false; }, 0);
});
stage.addEventListener('pointerleave', () => { dragStartX = null; stage.classList.remove('dragging'); });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') setCenter(centerIndex - 1);
  if (e.key === 'ArrowRight') setCenter(centerIndex + 1);
});

btnPick.onclick = () => {
  const m = cards[centerIndex].model;
  window.location.href = m.target + '?model=' + encodeURIComponent(m.id);
};

layout();
updateSpecs(900);

/* ---------- model dibiarkan diam di sudut awal, tidak auto-rotate ---------- */
function renderAll(){
  const n = cards.length;
  cards.forEach((entry, i) => {
    if (!entry.ready || !entry.group) return;
    let diff = i - centerIndex;
    if (diff > n / 2) diff -= n;
    if (diff < -n / 2) diff += n;
    if (Math.abs(diff) > 1) return;
    entry.renderer.render(entry.scene, entry.camera);
  });
}
const origSetCenter = setCenter;
setCenter = function(i){
  origSetCenter(i);
  const entry = cards[centerIndex];
  entry.rotY = 0;
  if (entry.group) entry.group.rotation.y = 0;
  requestAnimationFrame(renderAll);
};
cards.forEach(entry => {
  const check = () => { if (entry.ready) renderAll(); else requestAnimationFrame(check); };
  check();
});
window.addEventListener('resize', () => requestAnimationFrame(renderAll));
</script>
</body>
</html>
